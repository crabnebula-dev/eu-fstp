# CI for the FSTP platform workspace.
#
# Supply chain (TH-15, H-10): this workflow uses no actions at all, not even
# first-party ones. Each job checks out the commit with plain git and the
# job token, and installs toolchains with the runner's rustup.
#
# Jobs:
#   deps-check   dependency allowlist, no-Python, fuzz-target and layering gates
#   fmt-clippy   rustfmt and clippy -D warnings on the workspace and every fuzz project
#   test         cargo test on the workspace with a real PostgreSQL 16
#   fuzz-smoke   every fuzz target for 60 seconds on the pinned nightly (TH-26)
#   web          the pinned Node.js, tsc, the in-house web tests and fuzz harness,
#                and the generated API types (ADR-003, ADR-014)
#
# Every job that builds or runs code needs deps-check, so no crate outside
# the allowlist is compiled before the gate has passed. The deps-check job
# itself first proves that the gate's own build graph is in-house.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older run only on pull requests. Every commit
  # on the main branches keeps its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  GIT_TERMINAL_PROMPT: "0"

defaults:
  run:
    shell: bash

jobs:
  fmt-clippy:
    name: fmt and clippy
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          # The header lives only in this command's environment, never in .git/config.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup --version
          # rustup 1.28 and later install the toolchain file's channel and
          # components with no arguments; older rustup installs it on `rustup show`.
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      - name: rustfmt (workspace)
        run: cargo fmt --all -- --check
      - name: rustfmt (fuzz projects)
        run: |
          set -euo pipefail
          # deps-check fails on any cargo project outside these two globs.
          for m in crates/*/fuzz/Cargo.toml tools/*/fuzz/Cargo.toml; do
            echo "rustfmt $m"
            cargo fmt --manifest-path "$m" -- --check
          done
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (fuzz projects)
        run: |
          set -euo pipefail
          for m in crates/*/fuzz/Cargo.toml tools/*/fuzz/Cargo.toml; do
            echo "clippy $m"
            cargo clippy --manifest-path "$m" --all-targets --locked -- -D warnings
          done

  test:
    name: tests (PostgreSQL 16)
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The M2 testkit builds about 160 test binaries, and each links every
      # M2 crate. With full debug info they fill the runner's disk. Line
      # tables keep file and line numbers in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      # The runner image ships toolchains this job never uses. Removing them
      # leaves room for the test binaries.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install PostgreSQL 16 if absent
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          missing=0
          for b in initdb pg_ctl postgres psql; do
            [ -x "$pg_bin/$b" ] || missing=1
          done
          if [ "$missing" = 1 ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends postgresql-16
          fi
          "$pg_bin/postgres" --version
          echo "FSTP_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: cargo test
        run: cargo test --workspace --locked
      # The SQLSTATE condition-name table must match this PostgreSQL 16.
      - name: SQLSTATE table matches the server
        run: bash crates/fstp-pgwire/tools/gen-sqlstate.sh --check
      # rustls 0.23.46 asserts in debug builds after close_notify; release
      # builds must return a typed error instead (ADR-001 record, D4).
      - name: TLS after close_notify in a release build
        run: cargo test --release --locked -p fstp-tls --test tls d4_invalid_record_after_close_notify

  deps-check:
    name: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      - name: The gate builds only in-house code
        run: |
          set -euo pipefail
          # cargo tree resolves without compiling anything. Every package
          # that building deps-check needs must be a path package here.
          cargo tree --locked -p deps-check -e normal,build --target all \
            --prefix none --format '{p}' | sed 's/ (\*)$//' | sort -u \
            > "$RUNNER_TEMP/deps-check-tree.txt"
          cat "$RUNNER_TEMP/deps-check-tree.txt"
          if grep -v -F "($GITHUB_WORKSPACE/" "$RUNNER_TEMP/deps-check-tree.txt"; then
            echo "deps-check depends on a package outside the repository" >&2
            exit 1
          fi
      - name: Dependency allowlist, no-Python, fuzz-target and layering gates
        run: cargo run --locked -p deps-check -- --root .

  web:
    name: web (tsc, web tests, fuzz harness, generated types)
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ADR-003 record: Node.js 24.11.1 with its bundled npm 11.6.2, and the
      # SHA-256 of node-v24.11.1-linux-x64.tar.xz from nodejs.org SHASUMS256.txt.
      NODE_VERSION: "24.11.1"
      NPM_VERSION: "11.6.2"
      NODE_SHA256: "60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8"
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the pinned Node.js and check its SHA-256 (ADR-003)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          echo "$NODE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$archive" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Node.js and npm are the recorded versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: npm ci --ignore-scripts in web/ and e2e/
        run: |
          set -euo pipefail
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          (cd e2e && npm ci --ignore-scripts --no-audit --no-fund)
      - name: tsc on the pages, the build, the conformance checks and the tests
        run: |
          set -euo pipefail
          web/node_modules/.bin/tsc -p web/tsconfig.json
          web/node_modules/.bin/tsc -p web/build
          web/node_modules/.bin/tsc -p web/test/conformance
          web/node_modules/.bin/tsc -p web/test
      - name: The in-house web tests (ADR-014)
        run: node web/dist/test-build/test/runner.js
      - name: The in-house TypeScript fuzz harness (Q33 interim, TH-26)
        run: node web/dist/test-build/fuzz/run.js --iterations 20000
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update || rustup show
      - name: web/src/gen/api.ts matches the operation registry
        run: cargo run --locked -p gen-ts -- --check

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # One target directory shared by every fuzz project avoids rebuilding
      # the common crates once per project.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/fuzz
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install toolchains and cargo-fuzz (ADR-003)
        run: |
          set -euo pipefail
          rustup --version
          # The repository toolchain builds cargo-fuzz itself.
          rustup toolchain install --no-self-update || rustup show
          # The pinned nightly builds and runs the fuzz targets.
          nightly="$(tools/fuzz-all.sh --print-toolchain)"
          rustup toolchain install "$nightly" --profile minimal --no-self-update
          rustc "+$nightly" --version
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo fuzz --version
      - name: Run every fuzz target for 60 seconds
        run: tools/fuzz-all.sh -j "$(nproc)" 60
