# CI for the FSTP platform workspace.
#
# Supply chain (TH-15, H-10): this workflow uses no actions at all, not even
# first-party ones. Each job checks out the commit with plain git and the
# job token, and installs toolchains with the runner's rustup.
#
# Jobs:
#   deps-check   dependency allowlist, no-Python, fuzz-target and layering gates
#   fmt-clippy   rustfmt and clippy -D warnings on the workspace and every fuzz project
#   test         cargo test with a real PostgreSQL 16 in parallel parts: the
#                workspace in three, the multi-cell isolation tests, and the
#                HTTP and direct matrix tests in shards. Each part is gated
#                by the known-red list in ci/known-red.txt (tools/test-gate
#                --partial)
#   fuzz-smoke   every fuzz target for 60 seconds on the pinned nightly (TH-26)
#   web          the pinned Node.js, tsc, the in-house web tests and fuzz harness,
#                and the generated API types (ADR-003, ADR-014)
#   sbom         the CycloneDX 1.6 SBOM from deps-check, written twice and
#                compared byte for byte (R-NF-07, ADR-003)
#
# Every job that builds or runs code needs deps-check, so no crate outside
# the allowlist is compiled before the gate has passed. The deps-check job
# itself first proves that the gate's own build graph is in-house.
name: ci

on:
  push:
    # batch/** carries a merge batch: the lead merges it into main once its
    # CI shows no new failure (Daniel, 2026-11-06).
    branches: [master, main, "batch/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older run on pull requests and batch branches.
  # Every commit on the main branches keeps its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/batch/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  GIT_TERMINAL_PROMPT: "0"

defaults:
  run:
    shell: bash

jobs:
  fmt-clippy:
    name: fmt and clippy
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          # The header lives only in this command's environment, never in .git/config.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup --version
          # rustup 1.28 and later install the toolchain file's channel and
          # components with no arguments; older rustup installs it on `rustup show`.
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      - name: rustfmt (workspace)
        run: cargo fmt --all -- --check
      - name: rustfmt (fuzz projects)
        run: |
          set -euo pipefail
          # deps-check fails on any cargo project outside these two globs.
          for m in crates/*/fuzz/Cargo.toml tools/*/fuzz/Cargo.toml; do
            echo "rustfmt $m"
            cargo fmt --manifest-path "$m" -- --check
          done
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (fuzz projects)
        run: |
          set -euo pipefail
          for m in crates/*/fuzz/Cargo.toml tools/*/fuzz/Cargo.toml; do
            echo "clippy $m"
            cargo clippy --manifest-path "$m" --all-targets --locked -- -D warnings
          done

  # The tests run as parallel parts, each on its own runner (Daniel,
  # 2026-11-06). Each part builds only what it runs, and test-gate judges
  # it in partial mode against its own log. Together the parts run every
  # test of the workspace once, and the direct matrix once over its shards.
  test:
    name: tests (${{ matrix.part }})
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # packages: the cargo test target selection. filter and skip: the
        # libtest filters, which test-gate repeats so it judges the same
        # selection. shard: FSTP_MATRIX_SHARD for the matrix tests.
        include:
          - part: workspace
            packages: --workspace --exclude fstp-api-testkit --exclude fstp-domain-testkit
            skip: t_iso_i19_no_canary t_iso_i19_teeth t_iso_i20_ t_db_iso_ i80_root_canary_ i80_destroyed_epoch_seal_key_absent_from_process_memory i19_cell_process_serves_one_cell
            timeout: 60
          # I-19, I-20, I-80, I-82, I-83: the isolation (multi-cell) job of
          # m3-design sections 14.4 and 14.8, as a part of its own. It runs
          # every t_iso_* and t_db_iso_* test, the i80_root_canary_* scans,
          # the other process-mode memory scan and the process-mode I-19
          # test. The workspace part skips the same tests, and
          # teeth_m3_registry checks that each runs in exactly one part.
          - { part: isolation-multi-cell, packages: -p fstp-celltest --test t_iso_i19 --test t_iso_i20 --test t_db_iso_i82 --test i83_placement --test i80_custody --test i19_boundary, filter: t_iso_ t_db_iso_ i80_root_canary_ i80_destroyed_epoch_seal_key_absent_from_process_memory i19_cell_process_serves_one_cell, timeout: 60 }
          - part: domain-testkit
            packages: -p fstp-domain-testkit
            timeout: 60
          - part: api-testkit
            packages: -p fstp-api-testkit
            skip: t_authz_matrix_direct t_authz_matrix_http i66_m_activate
            timeout: 90
          # I-66: the M-ACTIVATE model check peaks at about 8 GB and runs
          # about 6 minutes (measured 2026-11-13). Beside the rest of the
          # api-testkit part it lost its runner three times, so it runs on
          # a runner of its own. Both tests of the binary run here.
          - { part: m-activate, packages: -p fstp-api-testkit --test i66_m_activate, timeout: 60 }
          # Q34 B: HTTP and MCP at the 9-row policy covering array. On CI the
          # shards ran past 50 minutes on 2026-11-12, so each has 100. Measured
          # locally on 4 threads: about 53 minutes in all, so 4 shards.
          - { part: matrix-http-0, packages: -p fstp-api-testkit --test t_authz_matrix_http, shard: 0/4, timeout: 100 }
          - { part: matrix-http-1, packages: -p fstp-api-testkit --test t_authz_matrix_http, shard: 1/4, timeout: 100 }
          - { part: matrix-http-2, packages: -p fstp-api-testkit --test t_authz_matrix_http, shard: 2/4, timeout: 100 }
          - { part: matrix-http-3, packages: -p fstp-api-testkit --test t_authz_matrix_http, shard: 3/4, timeout: 100 }
          # Q34 B: the direct channel at the full policy product (144
          # policies). On CI four shards ran past 100 minutes on 2026-11-13,
          # so each has 180. Measured locally on 4 threads: about 250 minutes in
          # all, so 12 shards of about 21 minutes.
          - { part: matrix-direct-0, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 0/12, timeout: 180 }
          - { part: matrix-direct-1, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 1/12, timeout: 180 }
          - { part: matrix-direct-2, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 2/12, timeout: 180 }
          - { part: matrix-direct-3, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 3/12, timeout: 180 }
          - { part: matrix-direct-4, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 4/12, timeout: 180 }
          - { part: matrix-direct-5, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 5/12, timeout: 180 }
          - { part: matrix-direct-6, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 6/12, timeout: 180 }
          - { part: matrix-direct-7, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 7/12, timeout: 180 }
          - { part: matrix-direct-8, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 8/12, timeout: 180 }
          - { part: matrix-direct-9, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 9/12, timeout: 180 }
          - { part: matrix-direct-10, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 10/12, timeout: 180 }
          - { part: matrix-direct-11, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 11/12, timeout: 180 }
    env:
      # The M2 testkit builds about 160 test binaries, and each links every
      # M2 crate. With full debug info they fill the runner's disk. Line
      # tables keep file and line numbers in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      TEST_PACKAGES: ${{ matrix.packages }}
      TEST_FILTER: ${{ matrix.filter }}
      TEST_SKIP: ${{ matrix.skip }}
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      # The runner image ships toolchains this job never uses. Removing them
      # leaves room for the test binaries.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install PostgreSQL 16 if absent
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          missing=0
          for b in initdb pg_ctl postgres psql; do
            [ -x "$pg_bin/$b" ] || missing=1
          done
          if [ "$missing" = 1 ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends postgresql-16
          fi
          "$pg_bin/postgres" --version
          echo "FSTP_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      # I-81 NOTE (2026-11-01), Q-F: the fstp-keyd and file custody tests
      # run on a loop-mounted ext4 key volume, so they assert full I-81
      # assurance here. The guard i81_note_linux_ci_key_volume_reports_full
      # fails when this variable is unset in Linux CI.
      - name: ext4 key volume for the file custody tests
        run: |
          set -euo pipefail
          img="$RUNNER_TEMP/keyvol.img"
          mnt="$RUNNER_TEMP/keyvol"
          truncate -s 256M "$img"
          mkfs.ext4 -q -F "$img"
          mkdir -p "$mnt"
          sudo mount -o loop "$img" "$mnt"
          sudo chown "$(id -u):$(id -g)" "$mnt"
          grep " $mnt " /proc/self/mountinfo
          echo "FSTP_KEY_VOLUME_DIR=$mnt" >> "$GITHUB_ENV"
      # Some tests are red on purpose: each waits on a seam that a named
      # lane closes, and ci/known-red.txt lists it with that seam and lane.
      # The run itself may fail; test-gate decides. It fails on any red
      # test not on the list, on a listed test that passes, on a crashed
      # test binary and on a compile error. In partial mode it calls a
      # listed test stale only when its binary ran here and this part's
      # libtest filters select it.
      - name: cargo test, then the known-red gate
        run: |
          set -uo pipefail
          read -ra packages <<< "$TEST_PACKAGES"
          libtest=()
          gate=(--partial)
          for f in $TEST_FILTER; do libtest+=("$f"); gate+=(--filter "$f"); done
          for s in $TEST_SKIP; do libtest+=(--skip "$s"); gate+=(--skip "$s"); done
          if [ -n "$TEST_SHARD" ]; then export FSTP_MATRIX_SHARD="$TEST_SHARD"; fi
          echo "cargo test ${packages[*]} -- ${libtest[*]} (shard ${TEST_SHARD:-none})"
          cargo test "${packages[@]}" --locked --no-fail-fast -- "${libtest[@]}" 2>&1 | tee "$RUNNER_TEMP/cargo-test.log" || true
          cargo run -q --locked -p test-gate -- --known-red ci/known-red.txt "${gate[@]}" "$RUNNER_TEMP/cargo-test.log"
      # I-80, Q27: the Linux-only process-memory scans ran in the isolation
      # run above, on the ext4 key volume. Their outcome is gated by
      # test-gate. This step fails when either did not run at all.
      - name: memory scan (I-80, Linux only)
        if: matrix.part == 'isolation-multi-cell'
        run: |
          set -euo pipefail
          for t in i80_root_canary_absent_from_cell_and_vault_memory \
                   i80_destroyed_epoch_seal_key_absent_from_process_memory; do
            grep -E "^test linux::$t \.\.\. " "$RUNNER_TEMP/cargo-test.log" \
              || { echo "the memory scan $t did not run"; exit 1; }
          done
      # The SQLSTATE condition-name table must match this PostgreSQL 16.
      - name: SQLSTATE table matches the server
        if: matrix.part == 'workspace'
        run: bash crates/fstp-pgwire/tools/gen-sqlstate.sh --check
      # rustls 0.23.46 asserts in debug builds after close_notify; release
      # builds must return a typed error instead (ADR-001 record, D4).
      - name: TLS after close_notify in a release build
        if: matrix.part == 'workspace'
        run: cargo test --release --locked -p fstp-tls --test tls d4_invalid_record_after_close_notify

  deps-check:
    name: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      - name: The gate builds only in-house code
        run: |
          set -euo pipefail
          # cargo tree resolves without compiling anything. Every package
          # that building deps-check needs must be a path package here.
          cargo tree --locked -p deps-check -e normal,build --target all \
            --prefix none --format '{p}' | sed 's/ (\*)$//' | sort -u \
            > "$RUNNER_TEMP/deps-check-tree.txt"
          cat "$RUNNER_TEMP/deps-check-tree.txt"
          if grep -v -F "($GITHUB_WORKSPACE/" "$RUNNER_TEMP/deps-check-tree.txt"; then
            echo "deps-check depends on a package outside the repository" >&2
            exit 1
          fi
      - name: Dependency allowlist, no-Python, fuzz-target and layering gates
        run: cargo run --locked -p deps-check -- --root .

  sbom:
    name: sbom (CycloneDX 1.6, R-NF-07)
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The same ADR-003 pins as the web job. The SBOM lists them as
      # build-time components.
      NODE_VERSION: "24.11.1"
      NPM_VERSION: "11.6.2"
      NODE_SHA256: "60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8"
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update || rustup show
      - name: Write the SBOM twice and check the bytes are identical
        run: |
          set -euo pipefail
          mkdir -p target/sbom
          for run in 1 2; do
            cargo run --locked -p deps-check -- sbom --root . \
              --out "target/sbom/run$run.cdx.json" \
              --node-version "$NODE_VERSION" --node-sha256 "$NODE_SHA256" \
              --npm-version "$NPM_VERSION"
          done
          cmp target/sbom/run1.cdx.json target/sbom/run2.cdx.json
          mv target/sbom/run1.cdx.json target/sbom/fstp.cdx.json
          rm target/sbom/run2.cdx.json
      - name: Publish the SBOM in the job log and summary
        run: |
          set -euo pipefail
          # This workflow uses no actions, so the SBOM is a build output of
          # this job's log. Its SHA-256 goes to the job summary.
          sha256sum target/sbom/fstp.cdx.json | tee -a "$GITHUB_STEP_SUMMARY"
          cat target/sbom/fstp.cdx.json

  web:
    name: web (tsc, web tests, fuzz harness, generated types)
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ADR-003 record: Node.js 24.11.1 with its bundled npm 11.6.2, and the
      # SHA-256 of node-v24.11.1-linux-x64.tar.xz from nodejs.org SHASUMS256.txt.
      NODE_VERSION: "24.11.1"
      NPM_VERSION: "11.6.2"
      NODE_SHA256: "60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8"
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the pinned Node.js and check its SHA-256 (ADR-003)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          echo "$NODE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$archive" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Node.js and npm are the recorded versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: npm ci --ignore-scripts in web/ and e2e/
        run: |
          set -euo pipefail
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          (cd e2e && npm ci --ignore-scripts --no-audit --no-fund)
      - name: tsc on the pages, the signing Worker with the vendored LibPDF, the build, the conformance checks and the tests
        run: |
          set -euo pipefail
          web/node_modules/.bin/tsc -p web/tsconfig.json
          web/node_modules/.bin/tsc -b web/src/sign
          web/node_modules/.bin/tsc -p web/build
          web/node_modules/.bin/tsc -p web/test/conformance
          web/node_modules/.bin/tsc -p web/test
      - name: The in-house web tests (ADR-014)
        run: node web/dist/test-build/test/runner.js
      - name: The in-house TypeScript fuzz harness (Q33 interim, TH-26)
        run: node web/dist/test-build/fuzz/run.js --iterations 20000
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update || rustup show
      - name: web/src/gen/api.ts matches the operation registry
        run: cargo run --locked -p gen-ts -- --check

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # One target directory shared by every fuzz project avoids rebuilding
      # the common crates once per project.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/fuzz
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install toolchains and cargo-fuzz (ADR-003)
        run: |
          set -euo pipefail
          rustup --version
          # The repository toolchain builds cargo-fuzz itself.
          rustup toolchain install --no-self-update || rustup show
          # The pinned nightly builds and runs the fuzz targets.
          nightly="$(tools/fuzz-all.sh --print-toolchain)"
          rustup toolchain install "$nightly" --profile minimal --no-self-update
          rustc "+$nightly" --version
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo fuzz --version
      - name: Run every fuzz target for 60 seconds
        run: tools/fuzz-all.sh -j "$(nproc)" 60
