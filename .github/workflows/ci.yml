# CI for the FSTP platform workspace.
#
# Supply chain (TH-15, H-10): this workflow uses no actions at all, not even
# first-party ones. Each job checks out the commit with plain git and the
# job token, and installs toolchains with the runner's rustup.
#
# Jobs:
#   deps-check   dependency allowlist, no-Python, fuzz-target and layering gates
#   fmt-clippy   rustfmt and clippy -D warnings on the workspace and every fuzz project
#   test         cargo test with a real PostgreSQL 16 in parallel parts: the
#                workspace without fstp-celltest, fstp-celltest in four
#                parts, the multi-cell isolation tests, the dev stack, the
#                testkits, the M-ACTIVATE checks, and the HTTP, MCP and
#                direct matrix tests in shards. Each part is gated
#                by the known-red list in ci/known-red.txt (tools/test-gate
#                --partial)
#   fuzz-smoke   every fuzz target on the pinned nightly (TH-26), in four
#                shards: 15 s per target on the light tier, 60 s on the full
#   web          the pinned Node.js, tsc, the in-house web tests and fuzz harness,
#                and the generated API types (ADR-003, ADR-014)
#   e2e-demo     the demo Playwright project against fstp-e2e-cell, on the
#                pinned Node.js and Chrome Headless Shell (ADR-003). Not a
#                part of the test matrix, so test-gate never judges it
#   sbom         the CycloneDX 1.6 SBOM from deps-check, written twice and
#                compared byte for byte (R-NF-07, ADR-003)
#
# CI tiers (Daniel, 2026-11-16, ADR-003). The test job runs in one of two
# tiers. Every other job is the same in both.
#   light  every push and pull request, and a manual run without `full`.
#          The matrix parts and the m-activate part stop at their first
#          step. Every other part skips the tests that LIGHT_SKIP names:
#          the teeth tests (`_teeth_`) and the matrix layout self-checks
#          (`matrix::tests::q34_`). It also caps each property at
#          LIGHT_PROP_MAX_CASES (32) cases through FSTP_PROP_MAX_CASES. A
#          test with a stated minimum count keeps it
#          (fstp_prop::Config::min_cases)
#   full   a manual run with `full` ticked: every part, every test, and
#          every property at its own case count. About an hour: full
#          run 44513445737 (2026-11-19) took 51 minutes. A
#          milestone closes, and a release ships, only on a green full run
# Start a full run under Actions, workflow "ci", "Run workflow", with the
# `full` box ticked. teeth_m3_registry checks both tiers.
#
# Every job that builds or runs code needs deps-check, so no crate outside
# the allowlist is compiled before the gate has passed. The deps-check job
# itself first proves that the gate's own build graph is in-house.
name: ci

on:
  push:
    # batch/** carries a merge batch: the lead merges it into main once its
    # CI shows no new failure (Daniel, 2026-11-06).
    branches: [master, main, "batch/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: >-
          Full run: the authorisation matrices, every teeth test and every
          property at its full case count (about an hour; run 44513445737
          took 51 minutes). Required to close a milestone or ship a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older run on pull requests and batch branches.
  # Every commit on the main branches keeps its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/batch/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  GIT_TERMINAL_PROMPT: "0"

defaults:
  run:
    shell: bash

jobs:
  fmt-clippy:
    name: fmt and clippy
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          # The header lives only in this command's environment, never in .git/config.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup --version
          # rustup 1.28 and later install the toolchain file's channel and
          # components with no arguments; older rustup installs it on `rustup show`.
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      - name: rustfmt (workspace)
        run: cargo fmt --all -- --check
      - name: rustfmt (fuzz projects)
        run: |
          set -euo pipefail
          # deps-check fails on any cargo project outside these two globs.
          for m in crates/*/fuzz/Cargo.toml tools/*/fuzz/Cargo.toml; do
            echo "rustfmt $m"
            cargo fmt --manifest-path "$m" -- --check
          done
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Each fuzz project is a workspace of its own, with its own target
      # directory by default, so the shared workspace crates compiled 66
      # times (about 22 minutes). One shared target directory compiles each
      # crate once per set of features. Measured locally on 4 projects: 49 s
      # with separate directories, 26 s with one shared directory.
      - name: clippy (fuzz projects)
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/fuzz-clippy-target"
          for m in crates/*/fuzz/Cargo.toml tools/*/fuzz/Cargo.toml; do
            echo "clippy $m"
            cargo clippy --manifest-path "$m" --all-targets --locked -- -D warnings
          done

  # The tests run as parallel parts, each on its own runner (Daniel,
  # 2026-11-06). Each part builds only what it runs, and test-gate judges
  # it in partial mode against its own log. On the full tier the parts
  # together run every test of the workspace once, and the direct matrix
  # once over its shards. The light tier leaves out the matrix parts, the
  # m-activate part, the teeth tests and the matrix layout self-checks,
  # and caps the property case counts.
  test:
    name: tests (${{ matrix.part }})
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # packages: the cargo test target selection. Selections separated
        # by ";" run one after another into one log. filter and skip: the
        # libtest filters, which test-gate repeats so it judges the same
        # selection. shard: FSTP_MATRIX_SHARD for the matrix tests.
        include:
          - part: workspace
            packages: --workspace --exclude fstp-api-testkit --exclude fstp-domain-testkit --exclude fstp-celltest
            timeout: 60
          # fstp-celltest in four parts (Daniel, 2026-11-16). In the
          # workspace part its binaries ran 76 minutes one after another
          # (CI run 43825968860). Each part names its binaries with --test,
          # a * matching any run of characters. The test times from that
          # run are about 19 minutes per part. teeth_m3_registry checks
          # that every test file, test and doc-test set runs in a part,
          # and that each test runs in exactly one part.
          # i79_recovery 999 s, i90_composite_verify 123 s.
          - { part: celltest-recovery, packages: -p fstp-celltest --test i79_recovery --test i90_composite_verify, timeout: 60 }
          # i77_login 885 s, i81_backups 240 s.
          - { part: celltest-login, packages: -p fstp-celltest --test i77_login --test i81_backups, timeout: 60 }
          # r_lg_04_sessions_and_devices 624 s, i78_stepup 242 s,
          # i38_egress 213 s, r_nf_m3 73 s.
          - { part: celltest-sessions, packages: -p fstp-celltest --test r_lg_04_sessions_and_devices --test i78_stepup --test i38_egress --test r_nf_m3, timeout: 60 }
          # Every other binary, the unit tests and the doc tests: about
          # 1,160 s. slice_devstack runs in the devstack part. The skips
          # leave the isolation tests to the isolation part.
          - part: celltest
            packages: >-
              -p fstp-celltest --lib --bins
              --test adr* --test fstp_vault_* --test harness_* --test review_*
              --test seam_* --test sod_* --test t_* --test th_* --test w0_*
              --test i16_funds --test i17_identity_release --test i18_*
              --test i19_boundary --test i20_tenants --test i24_audit_chain
              --test i27_canary --test i33_bank_reference --test i39_*
              --test i75_hybrids --test i80_custody --test i81_shred
              --test i82_role_plan --test i83_placement --test i86_declared_country
              --test i90_claim_mldsa_differential --test i90_every_verifier
              --test int3_route_admissions --test m3_cell_vault_tickets
              --test m6egr_mail_relay --test pg_crash --test r_cr_*
              --test r_id_03_documents --test r_nf_08_q_a_classes
              --test r_nf_09_cell_to_cp_link --test r_sw_02_cell_erasure
              --test seeded_vault_chain --test slice_http --test slice_world
              --test teeth_m3_registry --test w1a_world
              --test i85_concurrent_confirmations_execute_once --test keystore_restart_pg
              --test l2_oauth_pg --test prod_mcp_slice_pg --test g13_production_shell_facts
              --test l5_invitation_pg --test l5_sessions_recovery_pg --test l5_blobs_pg
              ; -p fstp-celltest --doc
            skip: t_iso_i19_no_canary t_iso_i19_teeth t_iso_i20_ t_db_iso_ i80_root_canary_ i80_destroyed_epoch_seal_key_absent_from_process_memory i19_cell_process_serves_one_cell i87_two_cells_never_cross t_iso_public_rate_limit_keys_are_per_cell
            timeout: 60
          # I-19, I-20, I-80, I-82, I-83, I-87: the isolation (multi-cell) job of
          # m3-design sections 14.4 and 14.8, as a part of its own. It runs
          # every t_iso_* and t_db_iso_* test, the i80_root_canary_* scans,
          # the other process-mode memory scan and the process-mode I-19
          # test, the I-87 two-cell test (TH-06) and the per-cell public rate
          # limit test (ADR-024). The celltest part skips
          # the same tests, and teeth_m3_registry checks that each runs in
          # exactly one part.
          - { part: isolation-multi-cell, packages: -p fstp-celltest --test t_iso_i19 --test t_iso_i20 --test t_iso_i87 --test t_iso_public_rate_limit --test t_db_iso_i82 --test i83_placement --test i80_custody --test i19_boundary, filter: t_iso_ t_db_iso_ i80_root_canary_ i80_destroyed_epoch_seal_key_absent_from_process_memory i19_cell_process_serves_one_cell i87_two_cells_never_cross, timeout: 60 }
          # W3b, M3 exit audit section 7 item 7: slice_devstack starts
          # fstp-devstack, which serves the compiled auth pages. This part
          # compiles them with the pinned Node.js and tsc first (ADR-003),
          # and no celltest part names the binary.
          # Lane L4: prod_mcp_e2e runs here too, after the step that builds
          # the fstp-cell binary.
          - { part: devstack, packages: -p fstp-celltest --test slice_devstack --test prod_mcp_e2e, timeout: 60 }
          - part: domain-testkit
            packages: -p fstp-domain-testkit
            timeout: 60
          - part: api-testkit
            packages: -p fstp-api-testkit
            skip: t_authz_matrix_direct t_authz_matrix_http i66_m_activate i67_m_activate i84_t_authz_matrix_mcp_equals_channel_policy_of_web
            timeout: 90
          # I-66 and I-67: the exhaustive M-ACTIVATE model checks. On CI run
          # 43873124657 the i66_m_activate binary ran 657 s and i67_m_activate
          # 958 s (its Sybil check alone 958 s, i67_m_activate 662 s). On run
          # 43853477946 they ran 1,186 s and 1,726 s. Before lane
          # m4/mactivate-mem they peaked at about 20 GB and lost their
          # runners. Since then each peaks under 2 GB (measured 2026-11-13).
          # They keep a part of their own, which runs only on the full tier
          # (Daniel, 2026-11-16), so every full run proves I-66 and I-67.
          # In full run 44513445737 (2026-11-19) the part took 50 minutes, so
          # its 120 stays.
          - { part: m-activate, packages: -p fstp-api-testkit --test i66_m_activate --test i67_m_activate, timeout: 120 }
          # I-84: the MCP channel matrix. Inside the api-testkit part it ran
          # past 75 minutes on 2026-11-13 and the part was cancelled at 90, so
          # it runs in 8 shards of its own, as the direct matrix does. In full
          # run 44513445737 (2026-11-19) a shard took at most 11 minutes, so
          # each has 25, about twice that.
          - { part: matrix-mcp-0, packages: -p fstp-api-testkit --test i84_mcp_matrix, filter: i84_t_authz_matrix_mcp_equals_channel_policy_of_web, shard: 0/8, timeout: 25 }
          - { part: matrix-mcp-1, packages: -p fstp-api-testkit --test i84_mcp_matrix, filter: i84_t_authz_matrix_mcp_equals_channel_policy_of_web, shard: 1/8, timeout: 25 }
          - { part: matrix-mcp-2, packages: -p fstp-api-testkit --test i84_mcp_matrix, filter: i84_t_authz_matrix_mcp_equals_channel_policy_of_web, shard: 2/8, timeout: 25 }
          - { part: matrix-mcp-3, packages: -p fstp-api-testkit --test i84_mcp_matrix, filter: i84_t_authz_matrix_mcp_equals_channel_policy_of_web, shard: 3/8, timeout: 25 }
          - { part: matrix-mcp-4, packages: -p fstp-api-testkit --test i84_mcp_matrix, filter: i84_t_authz_matrix_mcp_equals_channel_policy_of_web, shard: 4/8, timeout: 25 }
          - { part: matrix-mcp-5, packages: -p fstp-api-testkit --test i84_mcp_matrix, filter: i84_t_authz_matrix_mcp_equals_channel_policy_of_web, shard: 5/8, timeout: 25 }
          - { part: matrix-mcp-6, packages: -p fstp-api-testkit --test i84_mcp_matrix, filter: i84_t_authz_matrix_mcp_equals_channel_policy_of_web, shard: 6/8, timeout: 25 }
          - { part: matrix-mcp-7, packages: -p fstp-api-testkit --test i84_mcp_matrix, filter: i84_t_authz_matrix_mcp_equals_channel_policy_of_web, shard: 7/8, timeout: 25 }
          # Q34 B: HTTP and MCP at the 9-row policy covering array. Measured
          # locally on 4 threads: about 53 minutes in all, so 4 shards. In
          # full run 44513445737 (2026-11-19) a shard took at most 14 minutes,
          # so each has 30, about twice that.
          - { part: matrix-http-0, packages: -p fstp-api-testkit --test t_authz_matrix_http, shard: 0/4, timeout: 30 }
          - { part: matrix-http-1, packages: -p fstp-api-testkit --test t_authz_matrix_http, shard: 1/4, timeout: 30 }
          - { part: matrix-http-2, packages: -p fstp-api-testkit --test t_authz_matrix_http, shard: 2/4, timeout: 30 }
          - { part: matrix-http-3, packages: -p fstp-api-testkit --test t_authz_matrix_http, shard: 3/4, timeout: 30 }
          # Q34 B: the direct channel at the full policy product (144
          # policies). Measured locally on 4 threads: about 250 minutes in all,
          # so 12 shards of about 21 minutes. Since the matrix parts build
          # optimised (5073fa66), a shard of full run 44513445737 (2026-11-19)
          # took at most 25 minutes, so each has 50, about twice that.
          - { part: matrix-direct-0, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 0/12, timeout: 50 }
          - { part: matrix-direct-1, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 1/12, timeout: 50 }
          - { part: matrix-direct-2, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 2/12, timeout: 50 }
          - { part: matrix-direct-3, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 3/12, timeout: 50 }
          - { part: matrix-direct-4, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 4/12, timeout: 50 }
          - { part: matrix-direct-5, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 5/12, timeout: 50 }
          - { part: matrix-direct-6, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 6/12, timeout: 50 }
          - { part: matrix-direct-7, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 7/12, timeout: 50 }
          - { part: matrix-direct-8, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 8/12, timeout: 50 }
          - { part: matrix-direct-9, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 9/12, timeout: 50 }
          - { part: matrix-direct-10, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 10/12, timeout: 50 }
          - { part: matrix-direct-11, packages: -p fstp-api-testkit --lib, filter: t_authz_matrix_direct, shard: 11/12, timeout: 50 }
    env:
      # The M2 testkit builds about 160 test binaries, and each links every
      # M2 crate. With full debug info they fill the runner's disk. Line
      # tables keep file and line numbers in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      TEST_PACKAGES: ${{ matrix.packages }}
      TEST_FILTER: ${{ matrix.filter }}
      TEST_SKIP: ${{ matrix.skip }}
      TEST_SHARD: ${{ matrix.shard }}
      TEST_THREADS: ${{ matrix.threads }}
      # The light tier (Daniel, 2026-11-16). LIGHT_SKIP holds the libtest
      # skips that only the light tier adds, to libtest and test-gate
      # alike. `_teeth_`: the teeth tests, each of which plants a known bug
      # and proves a check catches it. `matrix::tests::q34_`: the three
      # matrix layout self-checks of the fstp-api-testkit library, which ran
      # 240 s to 421 s each. LIGHT_PROP_MAX_CASES caps every fstp-prop
      # property through FSTP_PROP_MAX_CASES. teeth_m3_registry checks that
      # LIGHT_SKIP drops nothing outside its declared classes and that the
      # full tier
      # adds no skip and no cap.
      LIGHT_SKIP: _teeth_ matrix::tests::q34_
      LIGHT_PROP_MAX_CASES: "32"
      # ADR-003 record, as in the web job. The devstack part compiles the
      # auth pages that slice_devstack and the dev stack serve.
      NODE_VERSION: "24.11.1"
      NPM_VERSION: "11.6.2"
      NODE_SHA256: "60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8"
    steps:
      # The tier (Daniel, 2026-11-16): full on a manual run with the full
      # box ticked, light on every other run. The authorisation matrices
      # (direct, HTTP and MCP, parts matrix-*) run at most 25 minutes a part,
      # and the M-ACTIVATE model checks (part m-activate) 50 minutes, in full
      # run 44513445737 (2026-11-19). On
      # the light tier each of these parts stops here (Daniel, 2026-11-16).
      # The per-operation agreement tests of the api-testkit part still run.
      - name: Decide the tier and whether this part runs
        id: part
        env:
          PART: ${{ matrix.part }}
          WANT_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          set -euo pipefail
          if [[ "$WANT_FULL" == true ]]; then tier=full; else tier=light; fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          if [[ ( "$PART" == matrix-* || "$PART" == m-activate ) && "$tier" != full ]]; then
            echo "$PART: skipped. The matrices and M-ACTIVATE run only on a full run (manual, with the full box ticked)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "$PART: runs on the $tier tier."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # The runner image ships toolchains this job never uses. Removing them
      # leaves room for the test binaries: on 2026-10-26 a build with full
      # debug info filled the disk (374e2c99). The removal took 75 to 127 s
      # on every part. On CI run 43873124657 every part started with 85 GB
      # free, and the removal freed 22 GB more. With at least 40 GB free it
      # now runs in the background while cargo test builds: a build cannot
      # write 40 GB in two minutes. With less free it runs here, before
      # anything else, as before. "Disk clean-up finished" checks it.
      - name: Free disk space
        if: steps.part.outputs.run == 'true'
        run: |
          set -euo pipefail
          df -h /
          dirs=(/usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL)
          free_gb="$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)"
          if (( free_gb >= 40 )); then
            echo "$free_gb GB free: the unused toolchains go in the background"
            nohup bash -c 'sudo rm -rf "$@"; echo "$?" > "$RUNNER_TEMP/free-disk.rc"' free-disk "${dirs[@]}" \
              > "$RUNNER_TEMP/free-disk.log" 2>&1 &
            echo "$!" > "$RUNNER_TEMP/free-disk.pid"
          else
            echo "$free_gb GB free: the unused toolchains go first"
            sudo rm -rf "${dirs[@]}"
            echo 0 > "$RUNNER_TEMP/free-disk.rc"
            df -h /
          fi
      - name: Check out with plain git
        if: steps.part.outputs.run == 'true'
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.part.outputs.run == 'true'
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      # The PostgreSQL build is pinned, so every runner answers alike. Runner
      # images move to a new minor version over some days, and a new minor
      # version can add an SQLSTATE code (16.16 added 22P07). To move the
      # pin, change PG_PACKAGE_VERSION and regenerate the SQLSTATE table
      # (crates/fstp-pgwire/tools/gen-sqlstate.sh) in the same commit.
      - name: Install the pinned PostgreSQL 16
        if: steps.part.outputs.run == 'true'
        env:
          PG_PACKAGE_VERSION: 16.16-1.pgdg24.04+1
          # SHA-256 of https://www.postgresql.org/media/keys/ACCC4CF8.asc,
          # the signing key of the PostgreSQL apt repository, as fetched
          # on 2026-11-19.
          PGDG_KEY_SHA256: 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          have="$(dpkg-query -W -f='${Version}' postgresql-16 2>/dev/null || true)"
          if [ "$have" != "$PG_PACKAGE_VERSION" ]; then
            echo "postgresql-16 is '$have', the pin is '$PG_PACKAGE_VERSION'"
            # The runner image holds a PostgreSQL build and no apt source
            # for it. The PostgreSQL apt repository keeps recent builds,
            # and its archive keeps the older ones.
            key="$RUNNER_TEMP/pgdg.asc"
            curl -fsSL --retry 3 -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "$PGDG_KEY_SHA256  $key" | sha256sum -c -
            sudo install -m 0644 "$key" /usr/share/keyrings/fstp-pgdg.asc
            {
              echo "deb [signed-by=/usr/share/keyrings/fstp-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main"
              echo "deb [signed-by=/usr/share/keyrings/fstp-pgdg.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main"
            } | sudo tee /etc/apt/sources.list.d/fstp-pgdg.list > /dev/null
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends --allow-downgrades \
              "postgresql-16=$PG_PACKAGE_VERSION" \
              "postgresql-client-16=$PG_PACKAGE_VERSION" \
              || { echo "the pinned PostgreSQL build is not in this runner's apt sources: move the pin"; exit 1; }
          fi
          have="$(dpkg-query -W -f='${Version}' postgresql-16)"
          [ "$have" = "$PG_PACKAGE_VERSION" ] \
            || { echo "postgresql-16 is '$have' after the install, the pin is '$PG_PACKAGE_VERSION'"; exit 1; }
          "$pg_bin/postgres" --version
          echo "FSTP_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      # I-81 NOTE (2026-11-01), Q-F: the fstp-keyd and file custody tests
      # run on a loop-mounted ext4 key volume, so they assert full I-81
      # assurance here. The guard i81_note_linux_ci_key_volume_reports_full
      # fails when this variable is unset in Linux CI.
      - name: ext4 key volume for the file custody tests
        if: steps.part.outputs.run == 'true'
        run: |
          set -euo pipefail
          img="$RUNNER_TEMP/keyvol.img"
          mnt="$RUNNER_TEMP/keyvol"
          truncate -s 256M "$img"
          mkfs.ext4 -q -F "$img"
          mkdir -p "$mnt"
          sudo mount -o loop "$img" "$mnt"
          sudo chown "$(id -u):$(id -g)" "$mnt"
          grep " $mnt " /proc/self/mountinfo
          echo "FSTP_KEY_VOLUME_DIR=$mnt" >> "$GITHUB_ENV"
      # slice_devstack starts fstp-devstack, which refuses to start without
      # the compiled auth pages (web/dist/auth). M3 exit audit section 7,
      # item 7. The pinned Node.js and tsc compile them (ADR-003) in the
      # devstack part only, before cargo test runs.
      - name: Compile the auth pages with the pinned Node.js and tsc (ADR-003)
        if: matrix.part == 'devstack'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          echo "$NODE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$archive" -C "$RUNNER_TEMP/node" --strip-components=1
          export PATH="$RUNNER_TEMP/node/bin:$PATH"
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          web/node_modules/.bin/tsc -p web/tsconfig.json
          test -d web/dist/auth
      # Lane L4: prod_mcp_e2e runs the production fstp-cell binary from its
      # configuration file (docs/handoff/production-mcp-design.md section
      # 4.1). cargo test does not build the binary of another package, so
      # the devstack part builds it first.
      - name: Build the fstp-cell binary for prod_mcp_e2e
        if: matrix.part == 'devstack'
        run: cargo build --locked -p fstp-cell --bin fstp-cell
      # Some tests are red on purpose: each waits on a seam that a named
      # lane closes, and ci/known-red.txt lists it with that seam and lane.
      # The run itself may fail; test-gate decides. It fails on any red
      # test not on the list, on a listed test that passes, on a crashed
      # test binary and on a compile error. In partial mode it calls a
      # listed test stale only when its binary ran here and this part's
      # libtest filters select it. The light tier adds its skips to
      # libtest and test-gate alike, so a skipped teeth test is neither
      # missing nor stale.
      - name: cargo test, then the known-red gate
        if: steps.part.outputs.run == 'true'
        env:
          TIER: ${{ steps.part.outputs.tier }}
          PART: ${{ matrix.part }}
        run: |
          set -uo pipefail
          libtest=()
          gate=(--partial)
          for f in $TEST_FILTER; do libtest+=("$f"); gate+=(--filter "$f"); done
          for s in $TEST_SKIP; do libtest+=(--skip "$s"); gate+=(--skip "$s"); done
          case "$TIER" in
            full) echo "full tier: no light skip, every property at its own case count" ;;
            light)
              for s in $LIGHT_SKIP; do libtest+=(--skip "$s"); gate+=(--skip "$s"); done
              export FSTP_PROP_MAX_CASES="$LIGHT_PROP_MAX_CASES"
              echo "light tier: skips $LIGHT_SKIP, properties capped at $FSTP_PROP_MAX_CASES cases"
              ;;
            *) echo "unknown tier '$TIER'"; exit 1 ;;
          esac
          if [ -n "$TEST_SHARD" ]; then export FSTP_MATRIX_SHARD="$TEST_SHARD"; fi
          if [ -n "${TEST_THREADS:-}" ]; then export RUST_TEST_THREADS="$TEST_THREADS"; fi
          # The matrix parts build with the `matrix` profile of Cargo.toml:
          # optimised, with debug assertions and overflow checks kept. Each
          # matrix fails fast (fstp_api_testkit::matrix::compare_grouped_with):
          # a sample of every group runs first, and a failing run stops at
          # 40 failures. A green run has judged every cell once.
          profile=()
          if [[ "$PART" == matrix-* ]]; then profile=(--profile matrix); fi
          # cargo cannot mix --doc with other targets, so a part may hold
          # several selections, separated by ";". read keeps each * as
          # it is, and cargo matches it against the target names.
          : > "$RUNNER_TEMP/cargo-test.log"
          IFS=';' read -ra selections <<< "$TEST_PACKAGES"
          for selection in "${selections[@]}"; do
            read -ra packages <<< "$selection"
            echo "cargo test ${profile[*]} ${packages[*]} -- ${libtest[*]} (shard ${TEST_SHARD:-none})"
            cargo test "${profile[@]}" "${packages[@]}" --locked --no-fail-fast -- "${libtest[@]}" 2>&1 | tee -a "$RUNNER_TEMP/cargo-test.log" || true
          done
          cargo run -q --locked -p test-gate -- --known-red ci/known-red.txt "${gate[@]}" "$RUNNER_TEMP/cargo-test.log"
      # The background removal of "Free disk space" must have finished and
      # succeeded. It waits on the removal's own PID for at most 300 s. The
      # disk use after the tests is the data for any later change here.
      - name: Disk clean-up finished
        if: always() && steps.part.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/free-disk.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/free-disk.pid")"
            for _ in $(seq 1 300); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            cat "$RUNNER_TEMP/free-disk.log"
          fi
          test "$(cat "$RUNNER_TEMP/free-disk.rc")" = 0
          df -h /
      # I-80, Q27: the Linux-only process-memory scans ran in the isolation
      # run above, on the ext4 key volume. Their outcome is gated by
      # test-gate. This step fails when either did not run at all.
      - name: memory scan (I-80, Linux only)
        if: matrix.part == 'isolation-multi-cell'
        run: |
          set -euo pipefail
          for t in i80_root_canary_absent_from_cell_and_vault_memory \
                   i80_destroyed_epoch_seal_key_absent_from_process_memory; do
            grep -E "^test linux::$t \.\.\. " "$RUNNER_TEMP/cargo-test.log" \
              || { echo "the memory scan $t did not run"; exit 1; }
          done
      # The SQLSTATE condition-name table must match this PostgreSQL 16.
      - name: SQLSTATE table matches the server
        if: matrix.part == 'workspace'
        run: bash crates/fstp-pgwire/tools/gen-sqlstate.sh --check
      # rustls 0.23.46 asserts in debug builds after close_notify; release
      # builds must return a typed error instead (ADR-001 record, D4).
      - name: TLS after close_notify in a release build
        if: matrix.part == 'workspace'
        run: cargo test --release --locked -p fstp-tls --test tls d4_invalid_record_after_close_notify

  deps-check:
    name: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      - name: The gate builds only in-house code
        run: |
          set -euo pipefail
          # cargo tree resolves without compiling anything. Every package
          # that building deps-check needs must be a path package here.
          cargo tree --locked -p deps-check -e normal,build --target all \
            --prefix none --format '{p}' | sed 's/ (\*)$//' | sort -u \
            > "$RUNNER_TEMP/deps-check-tree.txt"
          cat "$RUNNER_TEMP/deps-check-tree.txt"
          if grep -v -F "($GITHUB_WORKSPACE/" "$RUNNER_TEMP/deps-check-tree.txt"; then
            echo "deps-check depends on a package outside the repository" >&2
            exit 1
          fi
      - name: Dependency allowlist, no-Python, fuzz-target and layering gates
        run: cargo run --locked -p deps-check -- --root .

  sbom:
    name: sbom (CycloneDX 1.6, R-NF-07)
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The same ADR-003 pins as the web job. The SBOM lists them as
      # build-time components.
      NODE_VERSION: "24.11.1"
      NPM_VERSION: "11.6.2"
      NODE_SHA256: "60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8"
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update || rustup show
      - name: Write the SBOM twice and check the bytes are identical
        run: |
          set -euo pipefail
          mkdir -p target/sbom
          for run in 1 2; do
            cargo run --locked -p deps-check -- sbom --root . \
              --out "target/sbom/run$run.cdx.json" \
              --node-version "$NODE_VERSION" --node-sha256 "$NODE_SHA256" \
              --npm-version "$NPM_VERSION"
          done
          cmp target/sbom/run1.cdx.json target/sbom/run2.cdx.json
          mv target/sbom/run1.cdx.json target/sbom/fstp.cdx.json
          rm target/sbom/run2.cdx.json
      - name: Publish the SBOM in the job log and summary
        run: |
          set -euo pipefail
          # This workflow uses no actions, so the SBOM is a build output of
          # this job's log. Its SHA-256 goes to the job summary.
          sha256sum target/sbom/fstp.cdx.json | tee -a "$GITHUB_STEP_SUMMARY"
          cat target/sbom/fstp.cdx.json

  web:
    name: web (tsc, web tests, fuzz harness, generated types)
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ADR-003 record: Node.js 24.11.1 with its bundled npm 11.6.2, and the
      # SHA-256 of node-v24.11.1-linux-x64.tar.xz from nodejs.org SHASUMS256.txt.
      NODE_VERSION: "24.11.1"
      NPM_VERSION: "11.6.2"
      NODE_SHA256: "60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8"
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the pinned Node.js and check its SHA-256 (ADR-003)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          echo "$NODE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$archive" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Node.js and npm are the recorded versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: npm ci --ignore-scripts in web/ and e2e/
        run: |
          set -euo pipefail
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          (cd e2e && npm ci --ignore-scripts --no-audit --no-fund)
      - name: tsc on the pages, the signing Worker with the vendored LibPDF, the build, the conformance checks and the tests
        run: |
          set -euo pipefail
          web/node_modules/.bin/tsc -p web/tsconfig.json
          web/node_modules/.bin/tsc -b web/src/sign
          web/node_modules/.bin/tsc -p web/build
          web/node_modules/.bin/tsc -p web/test/conformance
          web/node_modules/.bin/tsc -p web/test
      - name: The in-house web tests (ADR-014)
        run: node web/dist/test-build/test/runner.js
      - name: The in-house TypeScript fuzz harness (Q33 interim, TH-26)
        run: node web/dist/test-build/fuzz/run.js --iterations 20000
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update || rustup show
      - name: web/src/gen/api.ts matches the operation registry
        run: cargo run --locked -p gen-ts -- --check

  # Daniel, 2026-11-13 (M3 exit audit section 7, item 26): the demo
  # Playwright project runs as a job of its own. It is not a part of the
  # test matrix, so test-gate never judges it. It builds the demo cell
  # (fstp-e2e-cell), starts it with its demo sign-in, runs the specs of
  # project demo, and stops the cell.
  e2e-demo:
    name: e2e (Playwright, demo)
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # ADR-003 record, as in the web job.
      NODE_VERSION: "24.11.1"
      NPM_VERSION: "11.6.2"
      NODE_SHA256: "60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8"
      # ADR-003 record, Playwright browsers: Chrome Headless Shell
      # 156.0.8078.4 (Playwright 1.64.1, chromium-headless-shell revision
      # 1248), the archive for linux64 and its SHA-256.
      PW_HEADLESS_SHELL_VERSION: "156.0.8078.4"
      PW_HEADLESS_SHELL_REVISION: "1248"
      PW_HEADLESS_SHELL_SHA256: "c3e50596aef52c58f8fda3c6b3411c33d34c88b177b3ed1c2243359fd3b8ba20"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install the pinned Node.js and check its SHA-256 (ADR-003)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          echo "$NODE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$archive" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Node.js and npm are the recorded versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: npm ci --ignore-scripts in web/ and e2e/
        run: |
          set -euo pipefail
          (cd web && npm ci --ignore-scripts --no-audit --no-fund)
          (cd e2e && npm ci --ignore-scripts --no-audit --no-fund)
      # ADR-003: Playwright browsers are fetched by a controlled CI step,
      # never during npm ci, and checked against the recorded SHA-256.
      # The layout is the one Playwright's own installer writes.
      - name: Fetch the pinned Chrome Headless Shell and check its SHA-256 (ADR-003)
        run: |
          set -euo pipefail
          browsers="$RUNNER_TEMP/ms-playwright"
          dir="$browsers/chromium_headless_shell-$PW_HEADLESS_SHELL_REVISION"
          archive="$RUNNER_TEMP/chrome-headless-shell-linux64.zip"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://cdn.playwright.dev/builds/cft/$PW_HEADLESS_SHELL_VERSION/linux64/chrome-headless-shell-linux64.zip"
          echo "$PW_HEADLESS_SHELL_SHA256  $archive" | sha256sum -c -
          mkdir -p "$dir"
          unzip -q "$archive" -d "$dir"
          rm -f "$archive"
          test -x "$dir/chrome-headless-shell-linux64/chrome-headless-shell"
          touch "$dir/INSTALLATION_COMPLETE"
          echo "PLAYWRIGHT_BROWSERS_PATH=$browsers" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1" >> "$GITHUB_ENV"
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update || rustup show
          rustc --version
          cargo --version
      # The demo specs need the demo sign-in, which tools/demo/run.sh turns
      # on by default (--demo-signin, test only, rule A9). With it every
      # spec of project demo passed locally on 2026-11-13 (464 of 464).
      - name: Build and start the demo cell
        run: |
          set -euo pipefail
          echo "FSTP_DEMO_STATE=$RUNNER_TEMP/demo" >> "$GITHUB_ENV"
          FSTP_DEMO_STATE="$RUNNER_TEMP/demo" tools/demo/run.sh start
      - name: Playwright, project demo
        run: tools/demo/run.sh e2e --workers=1
      - name: Stop the demo cell
        if: always()
        run: |
          tools/demo/run.sh stop || true
          if [ -f "$FSTP_DEMO_STATE/cell.log" ]; then tail -n 200 "$FSTP_DEMO_STATE/cell.log"; fi
          # A failed spec leaves error-context.md (the page snapshot and the
          # failing step); print it, since CI keeps no artifacts.
          find . -path ./target -prune -o -name error-context.md -print | while read -r f; do
            echo "== $f"; head -n 120 "$f"
          done

  # TH-26: every fuzz target runs on both tiers (Daniel, 2026-11-16). The
  # light tier runs each for FUZZ_LIGHT_SECONDS, the full tier for
  # FUZZ_FULL_SECONDS. Four shards split the 66 fuzz projects by index
  # (tools/fuzz-all.sh --shard), and together they hold every project
  # once. In one job, CI run 43873124657 spent about 12.6 minutes building
  # and 50 minutes fuzzing 202 targets at 60 s.
  fuzz-smoke:
    name: fuzz smoke (${{ matrix.shard }})
    needs: deps-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    env:
      FUZZ_SHARD: ${{ matrix.shard }}
      FUZZ_FULL_SECONDS: "60"
      FUZZ_LIGHT_SECONDS: "15"
      # One target directory shared by every fuzz project avoids rebuilding
      # the common crates once per project.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/fuzz
    steps:
      # The tier rule of the test job: full only on a manual run with the
      # full box ticked.
      - name: Decide the fuzz tier and the time per target
        id: fuzz
        env:
          WANT_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          set -euo pipefail
          if [[ "$WANT_FULL" == true ]]; then tier=full; seconds="$FUZZ_FULL_SECONDS"; else tier=light; seconds="$FUZZ_LIGHT_SECONDS"; fi
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "fuzz smoke $FUZZ_SHARD: $tier tier, $seconds s per target"
      - name: Check out with plain git
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$JOB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='checked out %H %s'
      - name: Install toolchains and cargo-fuzz (ADR-003)
        run: |
          set -euo pipefail
          rustup --version
          # The repository toolchain builds cargo-fuzz itself.
          rustup toolchain install --no-self-update || rustup show
          # The pinned nightly builds and runs the fuzz targets.
          nightly="$(tools/fuzz-all.sh --print-toolchain)"
          rustup toolchain install "$nightly" --profile minimal --no-self-update
          rustc "+$nightly" --version
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo fuzz --version
      - name: Run every fuzz target of this shard
        env:
          FUZZ_SECONDS: ${{ steps.fuzz.outputs.seconds }}
        run: |
          tools/fuzz-all.sh -j "$(nproc)" --shard "$FUZZ_SHARD" "$FUZZ_SECONDS"
