[[bin]]
name = "fuzz_required"
path = "fuzz_targets/fuzz_required.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cargo_lock"
path = "fuzz_targets/cargo_lock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cargo_metadata"
path = "fuzz_targets/cargo_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "npm_lock_decode"
path = "fuzz_targets/npm_lock_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tier_b_confirmations_decode"
path = "fuzz_targets/tier_b_confirmations_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rust_tokens"
