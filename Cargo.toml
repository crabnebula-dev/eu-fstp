# Each cargo-fuzz project is its own workspace with its own lockfile.
exclude = ["crates/*/fuzz", "tools/*/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

# Third-party crates. Each one is allowlisted in an ADR, and its full resolved
# tree is recorded there. Do not add an entry without an ADR.
[workspace.dependencies]
# ADR-002: async runtime. Minimal features; a new feature needs a review note in ADR-002.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time"] }
# ADR-002 review note of 2026-10-28: fstp-rt alone adds the signal feature on its own line.
# ADR-001 Tier A: TLS 1.3 only (no tls12 feature), aws-lc-rs provider, no logging.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "prefer-post-quantum"] }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["aws-lc-sys"] }
# ADR-001 Tier A, through rustls today. fstp-pki takes it as a dev-dependency for the
# W1i round-trip tests only.
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["alloc", "aws-lc-rs", "std"] }
# ADR-001 A1: secret wiping without unsafe. Features alloc and default only; derive is refused.
zeroize = { version = "=1.9.1" }
# ADR-001 Tier B, A2 and A3: git dependency pinned to one full commit, default features only.
# Release-gated (I-74). Only fstp-crypto depends on it (design section 2.4 rule 8).
moduletto = { git = "https://github.com/crabnebula-dev/moduletto", rev = "6c1ae92f2bf14eb56b5d48d1e7fc6f7ca5843683" }
# ADR-001 Tier B, record of 2026-11-06 (M5 lane L-PDF): the RustCrypto formats crates for
# CMS signed attributes and certificate parsing in fstp-pki only. Release-gated (I-74).
der = { version = "=0.7.10", default-features = false, features = ["alloc", "oid"] }
spki = { version = "=0.7.3", default-features = false, features = ["alloc"] }
x509-cert = { version = "=0.2.5", default-features = false }
cms = { version = "=0.2.3", default-features = false }

# In-house crates.
fstp-prop = { path = "crates/fstp-prop" }
fstp-mc = { path = "crates/fstp-mc" }
fstp-crypto = { path = "crates/fstp-crypto" }
fstp-rt = { path = "crates/fstp-rt" }
