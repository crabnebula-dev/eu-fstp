    # M4 journey layer, SPEC/12-journey-ui.md section 14 and ADR-015.
    "crates/fstp-journey",
    # M5, docs/handoff/m5-design.md section 10, lane L-PDF.
    "crates/fstp-pdf",
    # M12, docs/handoff/m10-m12-design.md section 3.1, lane L12-METRICS.
    "crates/fstp-calib",
    "tools/deps-check",
    "tools/gen-ts",
    "tools/test-gate",
    # M7, docs/handoff/m7-design.md section 5, lane L-CORPUS.
