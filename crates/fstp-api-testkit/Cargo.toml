[package]
name = "fstp-api-testkit"
description = "Test only. Fake M3 ports, the authorisation matrix, the three-channel harness, the canary vault, the M4 models and the fstp-e2e-cell binary (M4 design section 1.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Test only: never published and never a normal dependency of another
# crate (M4 design section 1.3, layering rule A9).
publish = false

[dependencies]
fstp-programme.workspace = true
fstp-creator.workspace = true
fstp-import.workspace = true
fstp-html.workspace = true
fstp-guide.workspace = true
fstp-public.workspace = true
fstp-tenant.workspace = true
fstp-access.workspace = true
fstp-api-core.workspace = true
fstp-oauth.workspace = true
fstp-mcp.workspace = true
fstp-signup.workspace = true
fstp-web = { workspace = true, features = ["test-cell"] }
fstp-web-assets.workspace = true
fstp-http.workspace = true
fstp-domain.workspace = true
fstp-engine.workspace = true
fstp-ledger.workspace = true
fstp-json.workspace = true
fstp-money.workspace = true
fstp-rt.workspace = true
fstp-domain-testkit.workspace = true
fstp-crypto.workspace = true
fstp-webauthn.workspace = true
fstp-prop.workspace = true
fstp-mc.workspace = true
fstp-tls.workspace = true
fstp-smtp.workspace = true

