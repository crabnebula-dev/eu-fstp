[package]
name = "fstp-report-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fstp-report = { path = ".." }
fstp-json = { path = "../../fstp-json" }

[[bin]]
name = "report_record_decode"
path = "fuzz_targets/report_record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guide_pdf"
path = "fuzz_targets/guide_pdf.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
