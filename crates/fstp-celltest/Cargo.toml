[package]
name = "fstp-celltest"
description = "Test only. Multi-cell worlds, custody simulator, software authenticator, canaries, scanners, references and models (M3 design section 14.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Test only: never published and never a dependency of a shipped crate
# (M3 design section 2.4, layering rule 9).
publish = false

[dependencies]
fstp-crypto.workspace = true
fstp-rt.workspace = true
fstp-pki.workspace = true
fstp-keys.workspace = true
fstp-custody.workspace = true
fstp-keyd = { workspace = true, features = ["test-needles"] }
fstp-audit.workspace = true
fstp-obs.workspace = true
fstp-pgstore.workspace = true
fstp-vault-proto.workspace = true
fstp-vault-core.workspace = true
fstp-vault.workspace = true
fstp-webauthn.workspace = true
fstp-auth.workspace = true
fstp-cell-core.workspace = true
# The world cell front serves the compiled auth pages (the world front,
# lane int5). Cargo unifies features over one build, so a release build of
# fstp-cell must not build this test-only crate with it.
fstp-cell = { workspace = true, features = ["dev-pages"] }
fstp-cp-proto.workspace = true
fstp-control.workspace = true
fstp-witness.workspace = true
fstp-edge.workspace = true
fstp-release.workspace = true
fstp-release-svc.workspace = true
fstp-backup.workspace = true
fstp-domain.workspace = true
fstp-engine.workspace = true
# The creator shell facts of a cell (lane F-CYCLE2).
fstp-creator.workspace = true
fstp-guide.workspace = true
fstp-programme.workspace = true
fstp-money.workspace = true
fstp-ledger.workspace = true
fstp-migrate.workspace = true
fstp-pgtest.workspace = true
fstp-prop.workspace = true
fstp-mc.workspace = true
fstp-domain-testkit.workspace = true
# M6 T2: the dispatch worker the M-DISPATCH model drives.
fstp-dispatch.workspace = true
# In-house edges of lane int5: the world logs its cell, vault and witness
# roles in over fstp-pgwire, and reaches the cells through fstp-tls and
# fstp-http.
fstp-pgwire.workspace = true
fstp-tls.workspace = true
fstp-http.workspace = true
# The control routes and stack manifest of `fstp-devstack e2e`.
fstp-json.workspace = true
# ADR-001 A6: aws-lc-rs ML-KEM-768, ML-DSA-65 and X25519 as test oracles only, with no feature change.
# A normal dependency, so the library oracles under src/reference can name it.
# This crate never ships, and layering rule 9 keeps the post-quantum oracles inside it.
aws-lc-rs.workspace = true

[dev-dependencies]
# Test only: the loopback SMTP sink for the moved dispatch and mail relay tests.
fstp-api-testkit = { path = "../fstp-api-testkit" }
# M9 lane C2: the notice companion verifier row of the I-90 sweep.
fstp-contract.workspace = true
fstp-mail.workspace = true
fstp-smtp.workspace = true
fstp-api-core.workspace = true

[lints]
workspace = true
