[package]
name = "fstp-pgstore-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fstp-pgstore = { path = ".." }
# In-house: the fixed test key and its data key id.
fstp-crypto = { path = "../../fstp-crypto" }
fstp-keys = { path = "../../fstp-keys" }

[[bin]]
name = "stored_entry_decode"
path = "fuzz_targets/stored_entry_decode.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
