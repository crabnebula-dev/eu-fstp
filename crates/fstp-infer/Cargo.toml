[package]
name = "fstp-infer"
description = "In-house inference client: typed data channel, chat-completions encoder, strict decoder and transports (M7 design section 3.3, R-LA-04, TH-01)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fstp-domain.workspace = true
fstp-findings.workspace = true
fstp-json.workspace = true
fstp-crypto.workspace = true
# ADR-033 record of lane L31: the HTTP transport is a feature, so a crate
# that needs only the data channel, the prompt set or the decoders links no
# TLS stack.
fstp-http = { workspace = true, optional = true }
fstp-rt.workspace = true

[features]
default = ["http"]
# The HTTP transport to a model endpoint (ADR-019).
http = ["dep:fstp-http"]

[dev-dependencies]
fstp-prop.workspace = true

[lints]
workspace = true
