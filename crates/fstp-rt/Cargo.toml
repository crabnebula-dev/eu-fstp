[package]
name = "fstp-rt"
description = "Thin internal runtime trait for spawning, timers and sockets (ADR-002), with a tokio implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ADR-002 review note of 2026-10-28: `signal` lets SIGTERM trigger `Shutdown`. No other crate enables it.
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
fstp-prop.workspace = true

[lints]
workspace = true
