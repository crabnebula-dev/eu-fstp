[package]
name = "fstp-edge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fstp-edge = { path = ".." }
fstp-rt = { path = "../../fstp-rt" }
fstp-tls = { path = "../../fstp-tls" }

[[bin]]
name = "client_hello_sni"
path = "fuzz_targets/client_hello_sni.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edge_config_decode"
path = "fuzz_targets/edge_config_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edge_routes_decode"
path = "fuzz_targets/edge_routes_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "route_table_decode"
path = "fuzz_targets/route_table_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tunnel_header_decode"
path = "fuzz_targets/tunnel_header_decode.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
