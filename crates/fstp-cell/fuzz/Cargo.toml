[package]
name = "fstp-cell-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fstp-cell = { path = ".." }

[[bin]]
name = "command_request_decode"
path = "fuzz_targets/command_request_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cell_config_decode"
path = "fuzz_targets/cell_config_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keystore_image_decode"
path = "fuzz_targets/keystore_image_decode.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
