[package]
name = "fstp-cell"
description = "Cell runtime: async engine, routes and background tasks (M3 design sections 2.3 and 5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fstp-cell-core.workspace = true
fstp-pgstore.workspace = true
fstp-custody.workspace = true
fstp-vault-proto.workspace = true
fstp-cp-proto.workspace = true
fstp-release.workspace = true
fstp-edge.workspace = true
fstp-http.workspace = true
fstp-tls.workspace = true
fstp-obs.workspace = true
fstp-rt.workspace = true
# M5 lane L-CHK: the deliverable fetch port and URL subset of the checks.
fstp-checks.workspace = true
# M6 lane L6-EGR: the SMTP submission client behind `Destination::MailSubmission`
# (ADR-018).
fstp-smtp.workspace = true
# In-house edges of lane W3a: the auth rules, WebAuthn, domain and engine
# types, the ledger store trait and entries, the audit chain and anchorer
# core, the erasure planner, and the canonical JSON and crypto calls.
fstp-auth.workspace = true
fstp-webauthn.workspace = true
fstp-domain.workspace = true
fstp-engine.workspace = true
fstp-ledger.workspace = true
fstp-audit.workspace = true
fstp-keys.workspace = true
fstp-json.workspace = true
fstp-crypto.workspace = true
# In-house edges of lane int5: the database client of the route backend
# and of the pools, and the witness connection protocol and its async
# lock (design sections 4.2 and 7.2).
fstp-pgwire.workspace = true
fstp-witness.workspace = true

[dev-dependencies]
fstp-prop.workspace = true
# In-house test-only crates: the witness core the scripted witness peer runs,
# the session view the erasure tests admit a tenant admin with, and the M2
# generators of the equivalence test (design section 14.6).
fstp-witness.workspace = true
fstp-auth.workspace = true
fstp-domain-testkit.workspace = true
# The crate itself with the test-only `memory` and `dev-pages` features,
# so its own tests reach the in-memory route backend and the page front.
# No shipped build enables either.
fstp-cell = { workspace = true, features = ["memory", "dev-pages"] }

[features]
# Test only: `routes::memory`, the in-memory backend and the local cell
# (design section 14.3). The `fstp-cell` binary never builds them.
memory = []
# Test and dev stack only: `http::Front::with_pages`, which serves the
# compiled auth pages of design section 11.2 (`routes::page_table`).
# Section 8.7 does not list those routes yet, so no shipped build enables
# it.
dev-pages = []

[lints]
workspace = true
