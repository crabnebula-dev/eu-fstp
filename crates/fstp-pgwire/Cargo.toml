[package]
name = "fstp-pgwire"
description = "In-house PostgreSQL wire protocol client. Extended query protocol only; no string-built SQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `Client::execute_rendered_ddl`, for `fstp-pgagent` only (ADR-011). Off by
# default, so no other crate can run SQL text that is not `&'static str`.
rendered-ddl = []

[dependencies]
fstp-rt.workspace = true
fstp-tls.workspace = true
fstp-crypto.workspace = true
fstp-json.workspace = true

[dev-dependencies]
fstp-prop.workspace = true
fstp-pgtest.workspace = true

[lints]
workspace = true
