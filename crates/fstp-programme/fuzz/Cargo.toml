[package]
name = "fstp-programme-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fstp-programme = { path = ".." }

[[bin]]
name = "spec_decode"
path = "fuzz_targets/spec_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spec_compile"
path = "fuzz_targets/spec_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "field_value_decode"
path = "fuzz_targets/field_value_decode.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
