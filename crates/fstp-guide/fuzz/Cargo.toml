publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fstp-guide = { path = ".." }

[[bin]]
name = "guide_template_parse"
path = "fuzz_targets/guide_template_parse.rs"
