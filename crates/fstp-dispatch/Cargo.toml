[package]
name = "fstp-dispatch"
description = "The M6 dispatcher over ops.outbox and the delivery log ops.delivery (M6 design section 5.1, I-25, I-26)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# In-house: the delivery rules of ops.delivery, shared with the store over
# PostgreSQL (M6 design section 3.2).
fstp-pgstore.workspace = true
# In-house: the body digest (HMAC-SHA256 through aws-lc-rs, ADR-001).
fstp-crypto.workspace = true
# In-house: the parser of the composed message (S2), the SMTP client
# (S3 to S5) and the runtime trait it runs on.
fstp-mail.workspace = true
fstp-smtp.workspace = true
fstp-rt.workspace = true

[dev-dependencies]
fstp-prop.workspace = true
fstp-tls.workspace = true
# The fstp-pgstore test harness (T3), shared by path.
fstp-pgtest.workspace = true
fstp-pgwire.workspace = true
fstp-audit.workspace = true
fstp-ledger.workspace = true
fstp-migrate.workspace = true
fstp-domain.workspace = true
fstp-money.workspace = true
fstp-keys.workspace = true

[lints]
workspace = true
