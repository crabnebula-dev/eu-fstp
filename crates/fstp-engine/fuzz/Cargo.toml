[package]
name = "fstp-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fstp-engine = { path = ".." }
fstp-domain = { path = "../../fstp-domain" }
fstp-money = { path = "../../fstp-money" }
fstp-ledger = { path = "../../fstp-ledger" }
fstp-json = { path = "../../fstp-json" }

[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decide_sequence"
path = "fuzz_targets/decide_sequence.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
