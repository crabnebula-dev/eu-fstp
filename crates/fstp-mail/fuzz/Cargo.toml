[package]
name = "fstp-mail-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fstp-mail = { path = ".." }
fstp-crypto = { path = "../../fstp-crypto" }

[[bin]]
name = "mime_parse"
path = "fuzz_targets/mime_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dkim_verify"
path = "fuzz_targets/dkim_verify.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
