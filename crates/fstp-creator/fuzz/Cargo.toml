[package]
name = "fstp-creator-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
fstp-creator = { path = ".." }
fstp-programme = { path = "../../fstp-programme" }

[[bin]]
name = "creator_command_decode"
path = "fuzz_targets/creator_command_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "creator_record_decode"
path = "fuzz_targets/creator_record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_total"
path = "fuzz_targets/validate_total.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guide_scan"
path = "fuzz_targets/guide_scan.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unsafe_code = "forbid"
