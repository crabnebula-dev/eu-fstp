[package]
name = "fstp-cell-core"
description = "Cell commands, records and state, the gate and the sans-IO driver. Pure (M3 design section 5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fstp-engine.workspace = true
fstp-domain.workspace = true
fstp-findings.workspace = true
fstp-auth.workspace = true
# In-house: the step-up route admission verifies the assertion itself
# through fstp_auth::stepup::verify_step_up, whose assertion type lives in
# fstp-webauthn (design section 8.4, I-78).
fstp-webauthn.workspace = true
fstp-keys.workspace = true
fstp-ledger.workspace = true
fstp-crypto.workspace = true
fstp-json.workspace = true

[dev-dependencies]
fstp-prop.workspace = true
# In-house test-only crates: the M2 corpus, generators and reference engine
# runs (fstp-domain-testkit), and the money types the domain codec
# generators build (fstp-money).
fstp-domain-testkit.workspace = true
fstp-money.workspace = true

[lints]
workspace = true
