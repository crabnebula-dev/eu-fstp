[package]
name = "fstp-pki"
description = "X.509 v3 DER certificate writer, lifetimes, proof of possession and CMS signed attributes. Pure: the caller signs (M3 design section 1.3, M5 design section 3.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fstp-crypto.workspace = true
# ADR-001 Tier B, record of 2026-11-06 (M5 lane L-PDF): `cms` encodes the PAdES signed
# attributes and the SignedData, and parses signer certificates. Release-gated (I-74).
der.workspace = true
spki.workspace = true
x509-cert.workspace = true
cms.workspace = true

[dev-dependencies]
fstp-prop.workspace = true
# Lane W1i round-trip tests only (ADR-001 Tier A). The tests sign with aws-lc-rs and read
# every certificate back with rustls-webpki. All three are already in Cargo.lock at these versions.
# rustls-pki-types supplies `UnixTime` and `CertificateDer`, which rustls-webpki does not re-export.
# This test-only edge is outside the production rule of design section 2.5 (no PEM use).
aws-lc-rs.workspace = true
rustls-pki-types.workspace = true
rustls-webpki.workspace = true

[lints]
workspace = true
